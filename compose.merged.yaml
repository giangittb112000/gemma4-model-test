# Serve model đã fine-tune (merged) — tách khỏi compose.yaml (base :8000).
# Chạy sau khi: cd finetune && make train
#
#   docker compose -f compose.merged.yaml up -d
#   VLLM_URL=http://localhost:8001 MODEL_ID=query-parser-ft make test

services:
  vllm-merged:
    image: vllm/vllm-openai:latest
    container_name: gemma4-vllm-merged
    runtime: nvidia
    ipc: host
    ports:
      - "8001:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:?set HF_TOKEN in .env}"
    command:
      - --model=/model
      - --served-model-name=query-parser-ft
      - --max-model-len=1024
      - --gpu-memory-utilization=0.85
      - --enforce-eager
      - --port=8000
    volumes:
      - ./finetune/outputs/merged:/model:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
