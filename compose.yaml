services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: gemma4-vllm
    runtime: nvidia
    ipc: host
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:?set HF_TOKEN in .env}"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    command:
      - --model=google/gemma-4-e2b-it
      - --max-model-len=1024
      - --gpu-memory-utilization=0.85
      - --enforce-eager
      - --port=8000
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s
