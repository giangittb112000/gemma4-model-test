services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: gemma4-vllm
    runtime: nvidia
    ipc: host                      # vLLM cần shared memory lớn
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:?set HF_TOKEN in .env}"
    command:
      - --model=google/gemma-4-e2b-it
      - --max-model-len=2048         # query ngắn -> không cần dài, tiết kiệm VRAM
      - --gpu-memory-utilization=0.5 # chừa VRAM cho Ollama đang chạy chung GPU
      - --port=8000
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s

  api:
    build: .
    container_name: gemma4-api
    ports:
      - "8000:8000"
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      VLLM_URL: "http://vllm:8000"
      MODEL_ID: "google/gemma-4-e2b-it"
      MAX_TOKENS: "128"

volumes:
  hf-cache:
