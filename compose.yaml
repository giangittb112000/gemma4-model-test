# Serve only — base + LoRA adapters trên :8000
# Train: docker compose -f compose.train.yaml run --rm train

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: gemma4-vllm
    runtime: nvidia
    ipc: host
    ports:
      - "8000:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:?set HF_TOKEN in .env}"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      MODEL_ID: "${MODEL_ID:-google/gemma-4-e2b-it}"
      MAX_MODEL_LEN: "${MAX_MODEL_LEN:-1024}"
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION:-0.80}"
      MAX_LORA_RANK: "${MAX_LORA_RANK:-64}"
      ADAPTERS_DIR: /adapters
    entrypoint: ["/bin/bash", "/scripts/vllm-serve.sh"]
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
      - ./models/adapters:/adapters:ro
      - ./scripts:/scripts:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 60s
